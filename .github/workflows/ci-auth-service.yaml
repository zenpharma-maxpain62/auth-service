name: CI - Auth Service
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: fetch tag
        id : fetch-tag
        run: echo "tag=$(git describe --tags --abbrev=0)" >> "$GITHUB_OUTPUT"

      - name: setup java
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: 17
          cache: maven

      - name: compile build test
        run: mvn verify --no-transfer-progress 

      - name: sonarqube - SAST + code quality
        uses: SonarSource/sonarqube-scan-action@da4450e400cebf84292b12a85d4ca0080ae2938c
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }} 
        with:
          args: >
            -Dsonar.organization=${{ vars.SONAR_ORG }}
            -Dsonar.projectKey=${{ vars.SONAR_PROJECT_KEY_API_GATEWAY }}
            -Dsonar.java.binaries=target/classes

      - name: configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.1.0
        with:
          audience: sts.amazonaws.com
          role-to-assume: arn:aws:iam::134448505602:role/zenpharma-dev-github-actions-role
          aws-region: ap-south-1

      - name: login to ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: build docker image
        id: image-build
        run: |
          IMAGE="${{ steps.login-ecr.output.registry }}/auth-service:${{ steps.fetch-tag.outputs.tag }}"
          docker build -t $IMAGE .
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"

      - name: trivy scan
        id: trivy-scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ steps.image-build.outputs.image }}
          format: sarif
          output: trivy-results.sarif
          severity: HIGH,CRITICAL
          exit-code: '0'
          ignore-unfixed: true

      - name: upload trivy scan results
        uses: actions/upload-artifact@v4
        with:
          name: trivy-results
          path: trivy-results.sarif
          retention-days: 1


      - name: push image to ECR
        id: image-push
        run: |
          IMAGE="${{ steps.image-build.outputs.image }}"
          docker push $IMAGE
      
  Deploy:
    name: Deploy to GITOPS
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write
      id-token: write
    steps:
      - name: checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: fetch tag
        id : fetch-tag
        run: echo "tag=$(git describe --tags --abbrev=0)" >> "$GITHUB_OUTPUT"

      - name: checkout gitops repo
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.GITOPS_REPO }}
          token: ${{ secrets.GITOPS_TOKEN }}
          path: _gitops

      - name: update image tag in gitops repo
        run: |
          cd _gitops
          git pull

          export IMAGE_TAG=${{ steps.fetch-tag.outputs.tag }}
          export CURRENT_IMAGE_TAG=$(grep tag envs/dev/values-auth-service.yaml | awk '{print $2}')
          sed -i "s/$CURRENT_IMAGE_TAG/$IMAGE_TAG/g" envs/dev/values-auth-service.yaml

          git config user.name  "maxpain62"
          git config user.email "maxpain62@gmail.com"

          git add envs/dev/values-auth-service.yaml
          git commit -m "Update auth-service image tag to $IMAGE_TAG"

          git push 
